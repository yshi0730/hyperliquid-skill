[project]
name = "hyperliquid-skill"
version = "0.1.0"
description = "Professional crypto spot & perpetual futures trading skill via Hyperliquid, for OpenClaw"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "hyperliquid", "trading", "crypto", "defi", "perpetual", "spot"]
dependencies = [
    "hyperliquid-python-sdk>=0.6.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "eth-account>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
hyperliquid-skill = "src.server:main"
